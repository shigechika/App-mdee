name: test
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        perl:
          [
            "5.40",
            "5.38",
            "5.36",
            "5.34",
            "5.32",
            "5.30",
            "5.28",
            "5.26",
          ]
    name: Perl ${{ matrix.perl }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Check bash version
        run: bash --version
      - name: Setup perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
      - name: Install pandoc
        # from the release of pandoc: the mirror of apt is sometimes
        # very slow for a package of this size
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R jgm/pandoc -p '*-amd64.deb' -D "$RUNNER_TEMP/pandoc"
          sudo dpkg -i "$RUNNER_TEMP"/pandoc/*.deb
          pandoc --version | head -1
      - name: Install libcmark (for --refill)
        run: sudo apt-get update && sudo apt-get install -y libcmark-dev
      - name: Install dependencies
        run: cpanm -nq --metacpan --installdeps --with-develop --with-recommends .
      - name: Run test
        run: prove -lr t
